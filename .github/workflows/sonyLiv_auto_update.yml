name: SonyLiv Playlist Update

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sonyliv-playlist
  cancel-in-progress: false

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Python Script from Private Repo
        run: |
          git clone https://${{ secrets.GH_PAT }}@github.com/${{ secrets.SECRET_REPO_NAME }}.git private_code
          cp private_code/scripts/sonyLiv_sm.py .
          rm -rf private_code

      - name: Run Python Script
        run: python sonyLiv_sm.py

      - name: Remove Python Script
        run: rm -f sonyLiv_sm.py

      - name: Commit and Push Files
        run: |
          FILES=""

          [ -f sonyLiv.m3u ] && FILES="$FILES sonyLiv.m3u"
          [ -f sonyLiv_data.json ] && FILES="$FILES sonyLiv_data.json"

          if [ -z "$FILES" ]; then
            echo "No output files found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add $FILES

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "🎬 Auto Update SonyLiv Data ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))"
          git push origin main
