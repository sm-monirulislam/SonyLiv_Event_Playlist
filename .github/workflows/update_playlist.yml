name: Auto Update Matches JSON & M3U Playlist

on:
  schedule:
    # প্রত্তেক ২ ঘন্টা পর পর অটো রান হবে (UTC Time)
    - cron: '0 */2 * * *'
  workflow_dispatch: # Manual run করার অপশন

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Repository-তে ফাইল push করার permission

    steps:
      # 1. Repo Check-out
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Python Setup
      - name: Set up Python
        uses: actions/python-versions@v5
        with:
          python-version: '3.10'

      # 3. Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. Run Python Script
      - name: Run Generator Script
        run: python generator.py

      # 5. Commit and Push Changes to Github
      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add matches.json playlist.m3u8
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update matches JSON and playlist" && git push)
