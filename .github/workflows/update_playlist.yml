name: SonyLiv Playlist Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update_playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Get Script from Private Repo
        env:
          REPO_NAME: ${{ secrets.SECRET_REPO_NAME }}
        run: |
          git clone https://${{ secrets.GH_PAT }}@github.com/sm-monirulislam/$REPO_NAME.git private_code
          cp private_code/scripts/sonyLiv_sm.py ./
          rm -rf private_code

      - name: Run Script
        run: python sonyLiv_sm.py

      - name: Remove Script
        run: rm -f sonyLiv_sm.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add sonyLiv.m3u sonyLiv_data.json
          git commit -m "Update SonyLiv Playlist" || echo "No changes"
          git push
