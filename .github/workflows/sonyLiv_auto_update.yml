name: SonyLiv Playlist Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch Python Script from Private Repo
        run: |
          git clone https://${{ secrets.GH_PAT }}@github.com/${{ secrets.SECRET_REPO_NAME }}.git private_code
          cp private_code/scripts/sonyLiv_sm.py .
          rm -rf private_code

      - name: Run Python Script
        run: python sonyLiv_sm.py

      - name: Remove Python Script
        run: rm -f sonyLiv_sm.py

      - name: Commit and Push Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sonyLiv.m3u sonyLiv_data.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "🎬 Auto Update SonyLiv Data ($(date -u '+%Y-%m-%d %H:%M:%S UTC'))"
          git push origin main
